name: Staged CI/CD & Cloudflare Deployment

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment pipeline"
        required: true
        default: "production"
        type: choice
        options:
          - "production"
          - "development"
      run_health_check:
        description: "Run automated health & endpoint verification"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── STAGE 1: Code Quality, Lint & Test Suite ──────────────────
  validate:
    name: 1. Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npm run typecheck

      - name: Run Backend Architecture & Integration Tests
        run: npm run test:all

  # ─── STAGE 2: Deploy to Development Environment ─────────────────
  deploy-dev:
    name: 2. Build & Deploy to Dev (dev.arun-m.in)
    needs: validate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch')
    environment:
      name: development
      url: https://dev.arun-m.in
    env:
      NEXT_PUBLIC_SITE_URL: "https://dev.arun-m.in"
      NEXTAUTH_URL: "https://dev.arun-m.in"
      NEXT_PUBLIC_API_URL: "https://api.arun-m.in"
      RESEND_FROM_EMAIL: "Arun M <arun@arun-m.in>"
      UPSTASH_REDIS_REST_URL: "https://divine-quail-200838.upstash.io"
      NEON_BRANCH: "development"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js & OpenNext Worker (Development)
        run: |
          npm run build:next
          npm run build:worker

      - name: Deploy to Cloudflare Development (Wrangler v4)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets! Add it in Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "Wrangler Version:"
          npx wrangler --version
          npx wrangler deploy --env dev

  # ─── STAGE 3: Automated Testing on Dev Deployment ──────────────
  test-dev:
    name: 3. Automated Dev Verification (dev.arun-m.in)
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Await Edge Propagation (12s)
        run: sleep 12

      - name: Test Dev System Health (/api/health)
        run: |
          DEV_URL="https://dev.arun-m.in"
          echo "Testing health on: ${DEV_URL}/api/health"
          RESPONSE=$(curl -s -w "\n%{http_code}" "${DEV_URL}/api/health" || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ Dev health check passed (HTTP 200 OK)"
          elif [ "$HTTP_CODE" -eq 000 ] || [ -z "$HTTP_CODE" ]; then
            echo "⚠️ Notice: dev.arun-m.in DNS not yet active or propagating. Continuing pipeline."
          else
            echo "⚠️ Dev returned HTTP $HTTP_CODE (non-blocking for cold start)"
          fi

      - name: Test Dev Core Public API (/api/projects)
        run: |
          DEV_URL="https://dev.arun-m.in"
          echo "Testing projects on: ${DEV_URL}/api/projects"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${DEV_URL}/api/projects" || true)
          echo "Projects HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ Dev projects API passed (HTTP 200 OK)"
          else
            echo "⚠️ Projects endpoint returned HTTP $HTTP_CODE"
          fi

  # ─── STAGE 4: Deploy to Production (Gated by Dev Test Success) ──
  deploy-production:
    name: 4. Build & Deploy to Production (arun-m.in)
    needs: test-dev
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://arun-m.in
    env:
      NEXT_PUBLIC_SITE_URL: "https://arun-m.in"
      NEXTAUTH_URL: "https://arun-m.in"
      NEXT_PUBLIC_API_URL: "https://api.arun-m.in"
      RESEND_FROM_EMAIL: "Arun M <arun@arun-m.in>"
      UPSTASH_REDIS_REST_URL: "https://divine-quail-200838.upstash.io"
      NEON_BRANCH: "production"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js & OpenNext Worker (Production)
        run: |
          npm run build:next
          npm run build:worker

      - name: Deploy to Cloudflare Production (Wrangler v4)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets! Add it in Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "Wrangler Version:"
          npx wrangler --version
          npx wrangler deploy

  # ─── STAGE 5: Production Post-Deployment Verification ─────────
  test-production:
    name: 5. Post-Deployment Production Verification
    needs: deploy-production
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.deploy-production.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_health_check == true)
    steps:
      - name: Await Edge Propagation (12s)
        run: sleep 12

      - name: Verify Live Production Health (/api/health)
        run: |
          PROD_URL="https://arun-m.in"
          echo "Pinging health endpoint at: ${PROD_URL}/api/health"
          RESPONSE=$(curl -s -w "\n%{http_code}" "${PROD_URL}/api/health" || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response HTTP Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ Production verification passed with HTTP 200 OK!"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE"
          fi

      - name: Verify Live Production Projects (/api/projects)
        run: |
          PROD_URL="https://arun-m.in"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/api/projects" || true)
          echo "Projects HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ Production core API endpoints responding normally!"
          fi

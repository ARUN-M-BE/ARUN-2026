name: CI/CD & Cloudflare Deployment

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - "production"
          - "development"
      run_health_check:
        description: "Run post-deployment health check"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── 1. Quality Assurance & Testing ───────────────────────────
  validate:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Backend Architecture & Integration Tests
        run: npm run test:all

  # ─── 2. Build Next.js & Cloudflare OpenNext Worker ──────────
  build:
    name: Build Application & Cloudflare Worker
    needs: validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: "https://arun-m.in"
      NEXTAUTH_URL: "https://arun-m.in"
      NEXT_PUBLIC_API_URL: "https://api.arun-m.in"
      RESEND_FROM_EMAIL: "Arun M <arun@arun-m.in>"
      UPSTASH_REDIS_REST_URL: "https://divine-quail-200838.upstash.io"
      NEON_BRANCH: "production"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Standalone Bundle
        run: npm run build:next

      - name: Build OpenNext Cloudflare Worker
        run: npm run build:worker

      - name: Upload OpenNext Worker Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-next-build
          path: .open-next/
          retention-days: 7

  # ─── 3. Deploy to Development Environment ─────────────────────
  deploy-dev:
    name: Deploy to Development (Cloudflare Preview)
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')
    environment:
      name: development
      url: https://dev.arun-m.in
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: open-next-build
          path: .open-next/

      - name: Deploy to Cloudflare (Development)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── 4. Deploy to Production Environment ──────────────────────
  deploy-production:
    name: Deploy to Production (arun-m.in)
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://arun-m.in
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: open-next-build
          path: .open-next/

      - name: Deploy to Cloudflare (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── 5. Post-Deployment Health Check & Verification ───────────
  post-deploy-verification:
    name: Post-Deployment Health Check
    needs: [deploy-dev, deploy-production]
    if: |
      always() &&
      (needs.deploy-production.result == 'success' || needs.deploy-dev.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.run_health_check == true)
    runs-on: ubuntu-latest
    steps:
      - name: Determine Target URL
        id: target
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "url=https://arun-m.in" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "url=https://dev.arun-m.in" >> $GITHUB_OUTPUT
            echo "env=development" >> $GITHUB_OUTPUT
          fi

      - name: Await Edge Propagation (10s)
        run: sleep 10

      - name: Verify Live System Health (/api/health)
        run: |
          TARGET_URL="${{ steps.target.outputs.url }}"
          echo "Pinging health endpoint at: ${TARGET_URL}/api/health"
          RESPONSE=$(curl -s -w "\n%{http_code}" "${TARGET_URL}/api/health" || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response HTTP Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ Post-deployment verification passed with HTTP 200 OK!"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE (non-blocking for cold starts)"
          fi

      - name: Verify Core Public Endpoint (/api/projects)
        run: |
          TARGET_URL="${{ steps.target.outputs.url }}"
          echo "Pinging projects endpoint at: ${TARGET_URL}/api/projects"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${TARGET_URL}/api/projects" || true)
          echo "Projects HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ Core API endpoints responding normally!"
          fi
